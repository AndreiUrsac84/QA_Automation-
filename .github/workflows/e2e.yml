name: E2E dauron-trust.com

on:
  schedule:
    - cron: '17 4,10,16 * * *'   # de 3 ori pe zi: 07:17, 13:17, 19:17 ora României (vară)
  workflow_dispatch:
    inputs:
      suite:
        description: 'tour | smoke | full'
        default: 'tour'
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - name: Teste
        run: |
          if [ "${{ github.event.inputs.suite }}" = "smoke" ]; then npm run test:smoke; else npm test; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Analiză automată a eșecurilor cu Claude (necesită secretul ANTHROPIC_API_KEY)
  claude-triage:
    needs: e2e
    if: failure() && vars.CLAUDE_TRIAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Suita E2E pentru dauron-trust.com a picat. Folosește subagentul qa-tester.
            Citește test-results/results.json, clasifică fiecare eșec (bug site / test fragil / schimbare voită / instabil).
            Pentru bugurile de site deschide un issue cu raportul. Pentru testele fragile deschide un PR cu reparația.
